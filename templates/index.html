<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Management System</h1>
            <a href="{{ url_for('add') }}" class="btn btn-primary">Add New Student</a>
        </header>

        <div class="search-bar">
            <form action="{{ url_for('index') }}" method="GET">
                <input type="text" name="search" placeholder="Search by name or roll no..." value="{{ search_query }}">
                <button type="submit" class="btn">Search</button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Clear</a>
            </form>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Roll No</th>
                        <th>Course</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for student in students %}
                    <tr>
                        <td>{{ student.id }}</td>
                        <td>{{ student.name }}</td>
                        <td>{{ student.roll_no }}</td>
                        <td>{{ student.course }}</td>
                        <td class="actions">
                            <a href="{{ url_for('edit', id=student.id) }}" class="btn btn-sm btn-warning">Edit</a>
                            <form action="{{ url_for('delete', id=student.id) }}" method="POST" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this student?');">
                                <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="5" class="empty-state">No students found. Add one!</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
